paths:
  /auth/kakao/login:
    get:
      summary: 카카오 로그인 페이지(swagger에서 테스트 불가)
      description: null
      tags:
        - Auth
      responses:
        '200':
          description: 카카오 로그인 페이지로 리다이렉트
  /auth/kakao/token:
    get:
      summary: 카카오 토큰 요청
      description: null
      tags:
        - Auth
      parameters:
        - in: query
          name: code
          required: true
          description: 인가 코드
          schema:
            type: string
      responses:
        '200':
          description: 카카오 토큰 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: 발급 성공
                  data:
                    type: object
                    example: {}
                required:
                  - statusCode
                  - message
                  - data
  /auth/kakao/user:
    get:
      summary: 카카오 서버가 요청하는 URL
      description: null
      tags:
        - Auth
      parameters:
        - in: query
          name: code
          required: true
          description: 기관코드
          schema:
            type: string
      responses:
        '200':
          description: 카카오 유저 정보 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 200
                  message:
                    type: string
                    example: 카카오 유저 정보 조회 성공
                  data:
                    type: object
                    example: {}
                required:
                  - statusCode
                  - message
                  - data
