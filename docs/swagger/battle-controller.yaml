paths:
  /battles:
    post:
      summary: 대결 생성
      tags:
        - Battles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - startDate
                - endDate
                - reward
                - userId
              properties:
                name:
                  type: string
                  description: 대결 이름
                  example: 대결이름
                startDate:
                  type: string
                  format: date
                  description: 대결 시작일자
                  example: '2024-01-01'
                endDate:
                  type: string
                  format: date
                  description: 대결 종료일자
                  example: '2024-02-01'
                reward:
                  type: string
                  description: 보상
                  example: 엽떡 사주기
                userId:
                  type: string
                  description: 사용자 ID
                  example: user123
      responses:
        '201':
          description: 대결 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    example: 201
                  message:
                    type: string
                    example: 생성성공
                  data:
                    type: object
                    description: 생성한 대결 정보
                required:
                  - statusCode
                  - message
                  - data
    get:
      summary: 대결 목록 조회
      tags:
        - Battles
      responses:
        '200':
          description: 대결 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Ok
                  data:
                    type: array
                    description: 대결 목록
                    items:
                      type: object
                      example:
                        - {}
                required:
                  - statusCode
                  - message
                  - data
  '/battles/{battleId}':
    get:
      summary: 배틀 조회
      description: id를 이용하여 배틀을 조회
      tags:
        - Battles
      parameters:
        - in: path
          name: battleId
          schema:
            type: integer
          required: true
          description: 배틀 ID
      responses:
        '200':
          description: 배틀 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: 상태코드
                    example: 200
                  message:
                    type: string
                    description: 생성완료
                    example: 응답 메시지
                  data:
                    type: object
                    description: <예>
                    example: 응답 데이터
                required:
                  - statusCode
                  - message
                  - data
    patch:
      summary: 배틀 데이터를 업데이트
      description: 식별값을 통해 배틀을 수정할 값으로 업데이트
      tags:
        - Battles
      parameters:
        - in: path
          name: battleId
          required: 'true   // 필수여부 설정(true, false)'
          schema:
            type: 'integer    // 파라미터 타입(string, number, boolean, ...)'
          description: 배틀 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                updateParams:
                  type: object
                  required:
                    - <필요값-1>
                    - <필요값-2>
                    - <등등..>
      responses:
        '200':
          description: 업데이트 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: 상태코드
                    example: 201
                  message:
                    type: string
                    description: 생성완료
                    example: 응답 메시지
                  data:
                    type: object
                    description: <예>
                    example: 응답 데이터
                required:
                  - statusCode
                  - message
                  - data
    delete:
      summary: 배틀을 취소하거나 종료
      description: 상황에 따라 특정 배틀을 취소하거나 종료시킴
      tags:
        - Battles
      parameters:
        - in: path
          name: battleId
          required: 'true   // 필수여부 설정(true, false)'
          schema:
            type: 'integer    // 파라미터 타입(string, number, boolean, ...)'
          description: 배틀 ID
        - in: query
          name: isCancel
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    description: 상태코드
                    example: 201
                  message:
                    type: string
                    description: 생성완료
                    example: 응답 메시지
                  data:
                    type: object
                    description: <예>
                    example: 응답 데이터
                required:
                  - statusCode
                  - message
                  - datas
